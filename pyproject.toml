[project]
name = "ai-voice-assistant"
version = "2.1.0"
description = "Production voice assistant backend (Sinhala/English) with a pluggable hybrid-RAG agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "bs4>=0.0.2",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "ruff>=0.17.3",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "starlette>=1.10.0",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.9",
    "sounddevice>=0.5.6",
    "websockets>=17.3",
]
# Visual harness for the welcome / language-selection flow: ``streamlit run ui/streamlit_app.py``
ui = [
    "streamlit>=1.40",
    "websockets>=17.3",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# Optional lifecycle hooks (warmup/aclose/...) on the ports are deliberately
# empty so implementations only override what they need.
ignore = ["B027"]
