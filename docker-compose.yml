
services:

  postgres:

    image: pgvector/pgvector:pg17
    container_name: cclarke-postgres
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - cclarke-network

  neo4j:

    image: neo4j:5
    container_name: cclarke-neo4j
    restart: always

    env_file:
      - .env

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins

    networks:
      - cclarke-network

  api:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: cclarke-api
    restart: always

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data

    depends_on:
      - postgres
      - neo4j

    networks:
      - cclarke-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  cclarke-network:
